# Forge Protocol — Gate 5: Monthly Cost Audit Automation
#
# Creates a GitHub issue on the 1st of each month with the cost audit template.
# Blocks deploys if audit is overdue (> 35 days since last audit).
#
# Copy to: .github/workflows/forge-monthly-audit.yml

name: Forge Monthly Audit

on:
  schedule:
    - cron: '0 10 1 * *'  # 1st of every month at 10:00 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  create-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create monthly audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MONTH=$(date +%Y-%m)
          PROJECT_NAME=$(basename $GITHUB_REPOSITORY)

          gh issue create \
            --title "Forge Monthly Audit — ${PROJECT_NAME} — ${MONTH}" \
            --label "forge-audit" \
            --body "$(cat <<'BODY'
          ## FORGE MONTHLY AUDIT — ${MONTH}

          **Instructions:** Complete within 14 days. Deploys blocked if overdue.

          ### 1. AI Token Spend
          | Metric | This Month | Last Month | Delta |
          |--------|-----------|------------|-------|
          | Total tokens | | | |
          | Total cost ($) | | | |
          | Cost per active user | | | |

          ### 2. Infrastructure Cost
          | Service | Cost | Notes |
          |---------|------|-------|
          | Hosting (Render/Vercel/Cloud Run) | | |
          | Database | | |
          | CDN/Storage | | |
          | Monitoring | | |
          | **Total** | | |

          ### 3. Cost Per Active User Trend
          - Trend direction: Rising / Flat / Declining
          - If rising, investigate: ___

          ### 4. Gate Cost Breakdown
          | Gate | AI Token Cost | Notes |
          |------|--------------|-------|
          | Gate 0 (Spec validation) | | Budget: $20/mo |
          | Gate 3 (Semantic tests) | | Budget: $10/mo |
          | Gate 5 (Weekly analysis) | | Budget: $15/mo |
          | **Total** | | Budget: $45/mo |

          ### 5. Optimization Opportunities
          - [ ] AI calls that could be cached
          - [ ] AI calls that could use cheaper model (Haiku vs Opus)
          - [ ] AI calls that could be batched
          - [ ] AI calls that could be eliminated

          ### Verdict
          - [ ] Costs within budget — no action
          - [ ] Optimization needed (link items)
          - [ ] Budget increase needed (justify)

          ---
          *Generated by Forge Protocol Gate 5 automation*
          BODY
          )"

      - name: Write audit artifact
        run: |
          mkdir -p .forge
          echo "FORGE_MONTHLY_AUDIT=$(date +%Y-%m-%d)" > .forge/monthly-audit.txt
          git config user.name "Forge Protocol"
          git config user.email "forge@ci.local"
          git add .forge/monthly-audit.txt
          git commit -m "forge: monthly audit created $(date +%Y-%m)" || echo "No changes"
          git push || echo "Push skipped"
