# Forge Protocol — Gate 5: Weekly Review Automation
#
# Creates a GitHub issue every Monday at 10:00 UTC with the review template.
# Makes the review visible and trackable — removes willpower from the equation.
#
# Copy to: .github/workflows/forge-weekly-review.yml

name: Forge Weekly Review

on:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday at 10:00 UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  create-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create weekly review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK_OF=$(date +%Y-%m-%d)
          PROJECT_NAME=$(basename $GITHUB_REPOSITORY)

          gh issue create \
            --title "Forge Weekly Review — ${PROJECT_NAME} — Week of ${WEEK_OF}" \
            --label "forge-review" \
            --body "$(cat <<'BODY'
          ## FORGE WEEKLY REVIEW — Week of ${WEEK_OF}

          **Instructions:** Complete this review within 7 days. Deploys will be blocked if overdue.

          ### Input data
          - [ ] Link to telemetry dashboard / logs: ___
          - [ ] Error monitoring summary: ___

          ### 6 Questions

          | # | Question | Finding | Severity | Action |
          |---|----------|---------|----------|--------|
          | 1 | **Dead features:** Which features had <5% engagement? Remove, redesign, or promote? | | | |
          | 2 | **Error clusters:** Group errors by root cause. Which cluster affects most users? | | | |
          | 3 | **Performance:** Any endpoint p95 > 2x last week? AI token cost increase > 20%? | | | |
          | 4 | **User friction:** Where do users drop off or retry? #1 friction point? | | | |
          | 5 | **Security:** New vulnerability findings? Suspicious access patterns? | | | |
          | 6 | **Top improvement:** Highest impact, lowest effort change? (A/B/C options) | | | |

          ### Verdict
          - [ ] No action needed
          - [ ] Items added to backlog (link issues below)
          - [ ] Urgent items require immediate attention

          ### Linked Issues
          - (add links to new issues created from findings)

          ---
          *Generated by Forge Protocol Gate 5 automation*
          BODY
          )"

      - name: Write review artifact
        run: |
          mkdir -p .forge
          echo "FORGE_WEEKLY_REVIEW=$(date +%Y-%m-%d)" > .forge/weekly-review.txt
          git config user.name "Forge Protocol"
          git config user.email "forge@ci.local"
          git add .forge/weekly-review.txt
          git commit -m "forge: weekly review created $(date +%Y-%m-%d)" || echo "No changes"
          git push || echo "Push skipped (PR branch or permissions)"
