# Forge Protocol — CI/CD Pipeline Template (FastAPI)
# Source: AIRIS (5/5 quality)
#
# 3-stage pipeline: unit tests -> smoke test -> (optional) e2e
# Copy to: .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -- Stage 1: Unit + Integration Tests --
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # Uncomment if your tests need credentials:
      # - name: Set up credentials
      #   if: env.HAS_CREDS == 'true'
      #   run: |
      #     echo '${{ secrets.SERVICE_ACCOUNT_KEY }}' > /tmp/sa.json
      #     echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> $GITHUB_ENV
      #   env:
      #     HAS_CREDS: ${{ secrets.SERVICE_ACCOUNT_KEY != '' }}

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  # -- Stage 2: Smoke Test (API lifecycle) --
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: pytest
    if: github.event_name == 'push'  # Only on merge to main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install httpx

      # Uncomment and adapt:
      # - name: Run smoke test
      #   run: python tests/smoke_test.py
      #   env:
      #     API_URL: ${{ vars.PROD_API_URL }}

  # -- Stage 3: Security Scanning --
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scanning (GitLeaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency scanning
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true  # Warn but don't block
